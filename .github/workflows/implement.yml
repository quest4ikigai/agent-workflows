# Reusable workflow — Path A: automated implementation of an approved issue.
#
# Called from a consumer's .github/workflows/agent-implement.yml wrapper on
# issues.opened / issues.labeled. Repository policy is read from the consumer's
# .github/agent/config.yml on its default branch. See docs/architecture.md.

name: agent-workflows / implement

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token (`claude setup-token`). Either this or ANTHROPIC_API_KEY is required.
        required: false
      ANTHROPIC_API_KEY:
        description: Anthropic API key, as an alternative to CLAUDE_CODE_OAUTH_TOKEN.
        required: false
      AGENT_GITHUB_TOKEN:
        description: Fine-grained PAT of a Codex-connected user; opens PRs and requests Codex reviews.
        required: false

permissions: {}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      config: ${{ steps.gate.outputs.config }}
    steps:
      - name: Fetch agent-workflows tooling
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are unavailable; cannot locate agent-workflows tooling."
            exit 1
          fi
          dest="$RUNNER_TEMP/agent-workflows"
          rm -rf "$dest"
          git -c init.defaultBranch=main init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$GITHUB_SERVER_URL/$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA"
          git -C "$dest" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "AW=$dest/lib/runtime/main.mjs" >> "$GITHUB_ENV"
          echo "agent-workflows tooling: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Evaluate trigger
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$AW" gate implement

  implement:
    name: Implement
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.config).implementation.timeout_minutes }}
    concurrency:
      group: agent-implement-${{ needs.gate.outputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    outputs:
      pr_number: ${{ steps.finish.outputs.pr_number }}
      request_review: ${{ steps.finish.outputs.request_review }}
    env:
      AW_CONFIG: ${{ needs.gate.outputs.config }}
      ISSUE_NUMBER: ${{ needs.gate.outputs.issue_number }}
    steps:
      - name: Verify secrets
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing repository secret CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY)."
            missing=1
          fi
          if [ -z "$AGENT_GITHUB_TOKEN" ]; then
            echo "::error::Missing repository secret AGENT_GITHUB_TOKEN."
            missing=1
          fi
          exit "$missing"

      - name: Fetch agent-workflows tooling
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are unavailable; cannot locate agent-workflows tooling."
            exit 1
          fi
          dest="$RUNNER_TEMP/agent-workflows"
          rm -rf "$dest"
          git -c init.defaultBranch=main init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$GITHUB_SERVER_URL/$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA"
          git -C "$dest" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "AW=$dest/lib/runtime/main.mjs" >> "$GITHUB_ENV"
          echo "agent-workflows tooling: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Preflight
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$AW" preflight-implement

      - name: Check out base branch
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.gate.outputs.config).base_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.preflight.outputs.proceed == 'true' && fromJSON(needs.gate.outputs.config).setup.node_version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(needs.gate.outputs.config).setup.node_version }}

      - name: Set up Python
        if: steps.preflight.outputs.proceed == 'true' && fromJSON(needs.gate.outputs.config).setup.python_version
        uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(needs.gate.outputs.config).setup.python_version }}

      - name: Run setup script
        id: setup
        if: steps.preflight.outputs.proceed == 'true'
        shell: bash
        env:
          SCRIPT: ${{ fromJSON(needs.gate.outputs.config).setup.script }}
        run: |
          set -euo pipefail
          if [ -z "$SCRIPT" ]; then echo "No setup script configured."; exit 0; fi
          if [ ! -f "$SCRIPT" ]; then echo "::error::Setup script $SCRIPT (setup.script) not found."; exit 1; fi
          bash "$SCRIPT"

      - name: Render prompt
        id: prompt
        if: steps.preflight.outputs.proceed == 'true'
        run: node "$AW" prompt implement

      - name: Implement with Claude
        id: claude
        if: steps.preflight.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: ${{ fromJSON(needs.gate.outputs.config).base_branch }}
          branch_prefix: ${{ fromJSON(needs.gate.outputs.config).branch_prefix }}
          branch_name_template: "{{prefix}}issue-{{entityNumber}}-{{description}}"
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: ${{ steps.prompt.outputs.claude_args }}

      - name: Read Claude result
        id: result
        if: steps.claude.outcome == 'success'
        env:
          RAW_RESULT: ${{ steps.claude.outputs.structured_output }}
        run: node "$AW" result implement

      - name: Run repository validation
        id: validate
        if: steps.result.outputs.status == 'implemented'
        shell: bash
        env:
          SCRIPT: ${{ fromJSON(needs.gate.outputs.config).validation.script }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Claude left uncommitted changes; validating the working tree as-is."
            git status --short
          fi
          if [ -z "$SCRIPT" ]; then
            echo "No validation script configured (validation.script); skipping."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$SCRIPT" ]; then echo "::error::Validation script $SCRIPT not found."; exit 1; fi
          bash "$SCRIPT"

      - name: Finish implementation
        id: finish
        if: always() && env.AW != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PREFLIGHT: ${{ steps.preflight.outputs.proceed }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          RAW_RESULT: ${{ steps.claude.outputs.structured_output }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          VALIDATION_RESULT: ${{ steps.validate.outputs.result }}
        run: node "$AW" finish-implement

  review:
    name: Request Codex review
    needs: [gate, implement]
    if: needs.implement.outputs.request_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.config).codex.job_timeout_minutes }}
    concurrency:
      group: agent-pr-${{ needs.implement.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Fetch agent-workflows tooling
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are unavailable; cannot locate agent-workflows tooling."
            exit 1
          fi
          dest="$RUNNER_TEMP/agent-workflows"
          rm -rf "$dest"
          git -c init.defaultBranch=main init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$GITHUB_SERVER_URL/$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA"
          git -C "$dest" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "AW=$dest/lib/runtime/main.mjs" >> "$GITHUB_ENV"
          echo "agent-workflows tooling: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Request Codex review and wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          AW_CONFIG: ${{ needs.gate.outputs.config }}
          PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
          ORIGIN: initial
        run: node "$AW" review-cycle
