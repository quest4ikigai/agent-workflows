# Internal: proves that a called workflow can locate and fetch this repository's
# runtime at the exact commit it was invoked from (job.workflow_repository /
# job.workflow_sha). Called by ci.yml; not part of the consumer interface.

name: agent-workflows / selftest

on:
  workflow_call:

permissions: {}

jobs:
  tooling:
    name: Fetch tooling at the workflow commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fetch agent-workflows tooling
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are unavailable; cannot locate agent-workflows tooling."
            exit 1
          fi
          dest="$RUNNER_TEMP/agent-workflows"
          rm -rf "$dest"
          git -c init.defaultBranch=main init -q "$dest"
          git -C "$dest" fetch -q --depth 1 "$GITHUB_SERVER_URL/$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA"
          git -C "$dest" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "AW=$dest/lib/runtime/main.mjs" >> "$GITHUB_ENV"
          echo "agent-workflows tooling: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Verify the runtime loads and matches the commit
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$(dirname "$(dirname "$(dirname "$AW")")")" rev-parse HEAD)" = "$WORKFLOW_SHA"
          node --input-type=module -e "const m = await import(process.env.AW); if (!m.COMMANDS.gate) process.exit(1); console.log('runtime commands:', Object.keys(m.COMMANDS).join(', '))"
          node --version
