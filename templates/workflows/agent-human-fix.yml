# Human-requested fix on a pull request.
#
# Trigger: a trusted user comments on a PR with a body starting "/agent-fix",
# followed by the feedback Claude should address. A successful fix starts a
# fresh review budget and requests an independent Codex review.
#
# This wrapper contains no repository policy. Configure behaviour in
# .github/agent/config.yml. Regenerate with `agent-workflows install`.
# Docs: https://github.com/quest4ikigai/agent-workflows

name: Agent - Human Fix

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  human-fix:
    # Cheap pre-filter so ordinary comments never start a runner.
    if: github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/agent-fix')
    uses: __AW_REPO__/.github/workflows/human-fix.yml@__AW_REF__
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
